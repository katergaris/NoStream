<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoStream</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0f1015">
<script>
  // Tema applicato prima del primo disegno, per evitare il lampo chiaro/scuro.
  (function () {
    var p = {};
    try { p = JSON.parse(localStorage.getItem('nostream.prefs')) || {}; } catch (e) {}
    var t = p.theme || 'auto';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <section id="view-search" class="view"></section>
  <section id="view-detail" class="view"></section>
  <section id="view-link" class="view"></section>
  <section id="view-downloads" class="view"></section>
  <section id="view-settings" class="view"></section>
  <section id="view-welcome" class="view"></section>
</main>

<nav class="tabbar" id="tabbar">
  <a href="#" data-tab="search"><span data-icon="search"></span><span data-t="tab.search"></span></a>
  <a href="#download" data-tab="downloads"><span data-icon="download"></span><span data-t="tab.downloads"></span><b id="dl-badge" class="badge" hidden></b></a>
  <a href="#impostazioni" data-tab="settings"><span data-icon="settings"></span><span data-t="tab.settings"></span></a>
</nav>

<div id="selbar" class="selbar" hidden></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
